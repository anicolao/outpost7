name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read
    
    env:
      CI: true
      VITE_PEER_HOST: 127.0.0.1
      VITE_PEER_PORT: 9000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start PeerJS Server
        run: |
          npm run peer-server > peer-server.log 2>&1 &
          sleep 5
      
      - name: Run e2e tests
        run: npm run test:e2e
      
      - name: Print PeerJS Logs
        if: failure()
        run: cat peer-server.log
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
            peer-server.log
          retention-days: 7
